<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 8: HTML5 Forms & Native Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        fieldset {
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 15px;
            padding: 15px;
        }
        legend {
            font-weight: bold;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0066cc;
            outline: none;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>

    <h2>Day 8: HTML5 Input Types & Native Validation</h2>

    <form action="#" method="POST">
        <fieldset>
            <legend>Account Information</legend>
            
            <div class="form-group">
                <label for="username">Username (Required, 4-12 characters):</label>
                <input type="text" id="username" name="username" required minlength="4" maxlength="12">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="user@example.com">
            </div>

            <div class="form-group">
                <label for="website">Portfolio URL:</label>
                <input type="url" id="website" name="website" placeholder="https://example.com">
            </div>
        </fieldset>

        <fieldset>
            <legend>Preferences & Details</legend>

            <div class="form-group">
                <label for="experience">Years of Experience (1-10):</label>
                <input type="number" id="experience" name="experience" min="1" max="10" value="1">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
            </div>

            <div class="form-group">
                <label for="skill-level">Skill Level (Range):</label>
                <input type="range" id="skill-level" name="skill-level" min="1" max="100">
            </div>

            <div class="form-group">
                <label for="theme">Favorite Color Theme:</label>
                <input type="color" id="theme" name="theme" value="#0066cc">
            </div>

            <div class="form-group">
                <label for="bio">Short Bio:</label>
                <textarea id="bio" name="bio" rows="4" placeholder="Tell us about yourself..."></textarea>
            </div>
        </fieldset>

        <button type="submit">Submit Form</button>
    </form>

</body>
</html>
