<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beginner HTML Practice</title>
</head>
<body>

    <h1>Welcome to My First Webpage</h1>
    
    <p>This is a simple paragraph of text. HTML uses tags to structure content on a webpage.</p>

    <h2>My Favorite Hobbies</h2>
    
    <ul>
        <li>Coding</li>
        <li>Reading</li>
        <li>Gaming</li>
    </ul>

    <h2>Useful Links</h2>
    
    <p>Visit <a href="https://www.google.com" target="_blank">Google</a> to search for information.</p>

    <h2>Sample Image</h2>
    <img src="https://via.placeholder.com/150" alt="Placeholder Image">

    <h2>Interactive Element</h2>
    <button type="button" onclick="alert('Hello, World!')">Click Me!</button>

</body>
</html>
